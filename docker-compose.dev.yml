services:
  sparkdash:
    build:
      context: .
      dockerfile: Dockerfile.dev
      platforms:
        - linux/arm64
    container_name: sparkDash-dev
    restart: unless-stopped
    # Host network: Vite :5173 + API :5555 bind on the host; local LLM
    # probes reach 127.0.0.1-bound servers (ds4-server / start.sh default).
    network_mode: host
    volumes:
      # Full source — server --watch + Vite HMR, no rebuild for code edits
      - .:/app
      - /app/node_modules
      # Host metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:/usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:ro
      # Full config dir (sparks.json, secrets, gpu-memory)
      - ./config:/app/config
      # Remote Sparks with SSH key auth — see docker-compose.yml. Uncomment:
      # - ${HOME}/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
    privileged: true
    # Share host PID namespace so nvidia-smi compute-apps sees GPU processes
    # (otherwise local VRAM falls back to minute-old config/gpu-memory.json).
    pid: host
    environment:
      - BIND_HOST=${BIND_HOST:-0.0.0.0}
      - PORT=${PORT:-5555}
      - LLM_PORT=${LLM_PORT:-8888}
      - COMFY_PORT=${COMFY_PORT:-8188}
      - NODE_ENV=development
      - HOST_PROC_PATH=/host/proc
      - HOST_SYS_PATH=/host/sys
      - HOST_ROOT_PATH=/host/root
      - POLL_INTERVAL_GPU=${POLL_INTERVAL_GPU:-2000}
      - POLL_INTERVAL_CPU=${POLL_INTERVAL_CPU:-2000}
      - POLL_INTERVAL_NETWORK=${POLL_INTERVAL_NETWORK:-2000}
      - POLL_INTERVAL_STORAGE=${POLL_INTERVAL_STORAGE:-5000}
      - POLL_INTERVAL_LLM=${POLL_INTERVAL_LLM:-2000}
      - POLL_INTERVAL_COMFY=${POLL_INTERVAL_COMFY:-2000}
      - POLL_INTERVAL_BANDWIDTH=${POLL_INTERVAL_BANDWIDTH:-2000}
      - POLL_INTERVAL_HERMES=${POLL_INTERVAL_HERMES:-600000}
      - POLL_INTERVAL_TAILSCALE=${POLL_INTERVAL_TAILSCALE:-30000}
      - POLL_INTERVAL_LIVENESS=${POLL_INTERVAL_LIVENESS:-5000}
      - TAILSCALE_PROBE_TIMEOUT_MS=${TAILSCALE_PROBE_TIMEOUT_MS:-8000}
      - HERMES_UPDATE_TIMEOUT_MS=${HERMES_UPDATE_TIMEOUT_MS:-600000}
      - SPARKDASH_SECRETS_KEY=${SPARKDASH_SECRETS_KEY:-}
      - SSH_IDENTITY_FILE=${SSH_IDENTITY_FILE:-}
      - PROMETHEUS_METRICS=${PROMETHEUS_METRICS:-false}
      - PROMETHEUS_METRICS_PATH=${PROMETHEUS_METRICS_PATH:-/metrics}
      - METRICS_PREFIX=${METRICS_PREFIX:-sparkdash_}
      - INFLUX_URL=${INFLUX_URL:-}
      - INFLUX_ORG=${INFLUX_ORG:-}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-}
      - INFLUX_TOKEN=${INFLUX_TOKEN:-}
      - INFLUX_INTERVAL_MS=${INFLUX_INTERVAL_MS:-10000}
      - INFLUX_TIMEOUT_MS=${INFLUX_TIMEOUT_MS:-5000}
      - CLOCK_CAP_MONITORING=${CLOCK_CAP_MONITORING:-false}
      - POLL_INTERVAL_CLOCK_CAP=${POLL_INTERVAL_CLOCK_CAP:-60000}
      - CLOCK_CAP_PROBE_TIMEOUT_MS=${CLOCK_CAP_PROBE_TIMEOUT_MS:-10000}
      - TOKENTRACE_HEAD_ID=${TOKENTRACE_HEAD_ID:-}
      - TOKENTRACE_DIR=${TOKENTRACE_DIR:-}
      - TOKENTRACE_TOKEN_OUTPUT=${TOKENTRACE_TOKEN_OUTPUT:-metadata}
      - TOKENTRACE_DETOKENIZE_URL=${TOKENTRACE_DETOKENIZE_URL:-http://127.0.0.1:8888/detokenize}
      - TOKENTRACE_MODEL=${TOKENTRACE_MODEL:-}
      - TOKENTRACE_DEMO=${TOKENTRACE_DEMO:-false}
      - SPARKDASH_DEMO=${SPARKDASH_DEMO:-false}

global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sparkdash
    metrics_path: /metrics
    static_configs:
      # One sparkDash instance exposes every unit it monitors.
      # Default: sparkDash running on the same Docker host.
      - targets: ["host.docker.internal:5555"]
        labels:
          site: local

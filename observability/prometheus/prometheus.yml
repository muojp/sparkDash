global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sparkdash
    metrics_path: /metrics
    static_configs:
      # One sparkDash instance exposes every unit it monitors.
      # Fleet head dgx01 (exports dgx01 + dgx02).
      - targets: ["192.168.0.100:5555"]
        labels:
          site: lab
      # For a laptop demo (SPARKDASH_DEMO=1 on the Docker host) add:
      # - targets: ["host.docker.internal:5555"]
      #   labels: { site: demo }
